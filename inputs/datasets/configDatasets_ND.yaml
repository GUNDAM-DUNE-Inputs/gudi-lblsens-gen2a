# ------------------------
# Dataset definitions
# ------------------------

- name: "ND"
  isEnabled: true

  showSelectedEventCount: true

# Debug Options
  devSingleThreadEventSelection: false
  devSingleThreadEventLoaderAndIndexer: false

  #selectedDataEntry: "data-FD" # default
  
  model:

    additionalLeavesStorage: 
      - "mcMode"
      - "isCC"
      - "mcEnu"
      - "recoEnu_nue"
      - "recoEnu_numu"

    # common tree name where the data are stored in each file
    tree: "event_tree"

    # MC files
    filePathList:

      #- "${ND_INPUTS}/ndlar_selected_flat_V0_GlobalAxes.root"    # V0 duneanal selection
      - "${ND_INPUTS}/ndlar_selected_flat_V0p1_GlobalAxes.root"   # V0p1 duneanal selection

    # base weight
    nominalWeightFormula:
      - "mcGenWeight * xsec_cvwgt"

  data:

    - name: "data-ND"
    
      tree: "event_tree"

      # MC files
      filePathList:
        - "${ND_INPUTS}/ndlar_selected_flat_V0p1_GlobalAxes.root"   # V0p1 duneanal selection

      # base weight
      nominalWeightFormula:
        - "mcGenWeight"
