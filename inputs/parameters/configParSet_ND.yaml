########################################################################
# Flux Systematics:
########################################################################
- name: "Flux Systematics"
  isEnabled: true
  enableThrowToyParameters: false
  enablePca: false

  #nominalStepSize: 0.1

  parameterDefinitionFilePath: "./inputs/parameters/flux/FluxSysCov_ND.root"
  covarianceMatrixTMatrixD: flux_param_cov
  parameterNameList: flux_param_names
  parameterPriorValueList: flux_param_priors
  printDialSetSummary: true

  parameterDefinitions:

    - name: "TargetUpstreamDegredation"
      isEnabled: true
      dialSetDefinitions:
        - dialType: Spline
          options: catmull-rom, monotonic
          applyOnDataSets: [ "ND" ]
          treeExpression: "TargetUpstreamDegredation_TGraph"
          minDialResponse: 0
          maxDialResponse: 100
