#########################################################################
# Cross-Section systematics
#########################################################################

- name: "Cross-Section Systematics"
  isEnabled: true
  enableThrowToyParameters: false
  enablePca: false

  #nominalStepSize: 0.1

  # Decompose the cov matrix
  parameterDefinitionFilePath: "./inputs/parameters/xsec/XsecSysCov_ND.root"
  covarianceMatrixTMatrixD: xsec_param_cov
  parameterNameList: xsec_param_names
  parameterPriorValueList: xsec_param_priors
  printDialSetSummary: true

  # Toy throwing properties
  #throwEnabledList: "xsec_param_throw"

  parameterDefinitions:

    - name: "GENIEReWeight_DUNE_v0_ZExpA1CCQE"
      isEnabled: true
      dialSetDefinitions:
        - dialType: Spline
          options: catmull-rom, monotonic
          applyOnDataSets: [ "ND" ]
          treeExpression: "GENIEReWeight_DUNE_v0_ZExpA1CCQE_TGraph"
