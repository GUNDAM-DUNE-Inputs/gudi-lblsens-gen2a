####################################################################
# Oscillation Parameters
####################################################################

- name: "Oscillation Parameters"
  isEnabled: true
  enableThrowToyParameters: false
  nominalStepSize: 1.0
  parameterDefinitionFilePath: "./inputs/parameters/oscProb/oscCovTDR_NO.root"
  covarianceMatrix: osc_param_cov
  parameterNameList: osc_param_names
  parameterPriorValueList: osc_param_priors

  parameterDefinitions:
    - name: "PMNS_SIN_SQUARED_12"
      isEnabled: true
      priorValue: 0.310 # PDG quotes 0.307
      parameterStepSize: 0.01
      #priorType: Flat
      physicalLimits: [ 0.0, 1.0]
      parameterLimits: [ 0.0, 1.0]      #parameterLimits: [ 0.25, 0.37 ]

    - name: "PMNS_SIN_SQUARED_13"
      isEnabled: true
      priorValue: 0.0224 # PDG quotes 0.0219
      parameterStepSize: 0.0007
      #priorType: Flat
      physicalLimits: [ 0.0, 1.0]
      parameterLimits: [ 0.0, 1.0 ]
      #parameterLimits: [ 0.018, 0.034 ]

    - name: "PMNS_SIN_SQUARED_23"
      isEnabled: true
      priorValue: 0.582   # PDG quotes 0.558
      priorType: Flat
      parameterStepSize: 0.04
      parameterLimits: [ 0.0, 1.0 ]      
      #parameterLimits: [ 0.42, 0.62 ]

    - name: "PMNS_DELTA_MASS_SQUARED_21"
      isEnabled: true
      priorValue: 7.39E-5
      #priorType: Flat
      parameterStepSize: 2.0e-6
      #parameterLimits: [ 6.96E-5, 8.10E-5 ]    # 3 sigma around PDG
      #parameterLimits: [ 4E-5, 12E-5 ]

    - name: "PMNS_DELTA_MASS_SQUARED_32"
      isEnabled: true
      priorValue: 0.002525
      priorType: Flat
      parameterStepSize: 2.6E-4
      #parameterLimits: [ 2.46e-3, 2.62e-3 ]

    - name: "PMNS_DELTA_CP"
      isEnabled: true
      priorValue: -2.498  # 1.19 pi
      priorType: Flat
      parameterStepSize: 1.0
      cyclicRange: [ -3.14159265359, 3.14159265359 ]

    - name: "PMNS_SIGN_MASS_SQUARED_32"
      isEnabled: true
      isFixed: true
      # PDG 2025 value: inverted
      priorValue: 0.5           # DUNE prior from Nu-Fit 5.2 w/ SK atm
      priorType: Flat
      parameterStepSize: 0.5
      parameterLimits: [ -1.0, 1.0 ]

  dialSetDefinitions:

  #######################################################################3
  #
  # MUON TO ELECTRON, MUON, TAU
